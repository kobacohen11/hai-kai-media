<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="איור דמות מחייכת">
  <defs>
    <radialGradient id="av-bg" cx="35%" cy="25%" r="85%"><stop offset="0" stop-color="#f6fafb"/><stop offset=".65" stop-color="#dfecee"/><stop offset="1" stop-color="#bcd3d7"/></radialGradient>
    <radialGradient id="av-skin" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#ffe6d6"/><stop offset=".6" stop-color="#ffcdb2"/><stop offset="1" stop-color="#e9a283"/></radialGradient>
    <linearGradient id="av-hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a2e22"/><stop offset="1" stop-color="#2d1410"/></linearGradient>
    <linearGradient id="av-hair-hi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a5a3f" stop-opacity=".9"/><stop offset="1" stop-color="#9a5a3f" stop-opacity="0"/></linearGradient>
    <radialGradient id="av-iris" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#a3683f"/><stop offset="1" stop-color="#4a2716"/></radialGradient>
    <linearGradient id="av-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7cc4"/><stop offset="1" stop-color="#c13d8f"/></linearGradient>
    <radialGradient id="av-shade" cx="50%" cy="100%" r="60%"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <clipPath id="av-clip"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#av-clip)">
    <circle cx="100" cy="100" r="100" fill="url(#av-bg)"/>
    <circle cx="60" cy="40" r="40" fill="#fff" opacity=".12"/>
    <!-- hair back -->
    <path d="M48 96 Q40 40 100 34 Q162 40 152 100 Q160 150 146 176 L54 176 Q38 150 48 96 Z" fill="url(#av-hair)"/>
    <!-- body -->
    <path d="M36 210 Q40 166 100 160 Q160 166 164 210 Z" fill="url(#av-top)"/>
    <path d="M70 168 Q100 186 130 168" fill="none" stroke="#ffd1ea" stroke-width="3" opacity=".7"/>
    <!-- neck -->
    <path d="M86 138 L86 164 Q100 172 114 164 L114 138 Z" fill="#eaa98b"/>
    <!-- ears -->
    <ellipse cx="55" cy="106" rx="8" ry="11" fill="#f2b496"/>
    <ellipse cx="145" cy="106" rx="8" ry="11" fill="#f2b496"/>
    <circle cx="54" cy="120" r="4" fill="#4fc3c9" stroke="#fff" stroke-width="1.5"/>
    <circle cx="146" cy="120" r="4" fill="#4fc3c9" stroke="#fff" stroke-width="1.5"/>
    <!-- head -->
    <ellipse cx="100" cy="100" rx="46" ry="50" fill="url(#av-skin)" stroke="#b9785a" stroke-width="2.2"/>
    <!-- bangs -->
    <path d="M53 98 Q50 48 100 44 Q152 48 147 98 Q140 72 120 64 Q112 76 88 72 Q66 76 53 98 Z" fill="url(#av-hair)"/>
    <path d="M70 56 Q92 44 122 52 Q100 52 82 62 Z" fill="url(#av-hair-hi)"/>
    <!-- brows -->
    <path d="M73 86 Q82 80 91 85" fill="none" stroke="#4a2716" stroke-width="3" stroke-linecap="round"/>
    <path d="M109 85 Q118 80 127 86" fill="none" stroke="#4a2716" stroke-width="3" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="82" cy="102" rx="10" ry="12" fill="#fff"/>
    <ellipse cx="118" cy="102" rx="10" ry="12" fill="#fff"/>
    <circle cx="83" cy="104" r="8" fill="url(#av-iris)"/>
    <circle cx="117" cy="104" r="8" fill="url(#av-iris)"/>
    <circle cx="83" cy="105" r="3.6" fill="#1a0c07"/>
    <circle cx="117" cy="105" r="3.6" fill="#1a0c07"/>
    <circle cx="86" cy="100" r="2.8" fill="#fff"/>
    <circle cx="120" cy="100" r="2.8" fill="#fff"/>
    <circle cx="80.5" cy="108" r="1.3" fill="#fff" opacity=".8"/>
    <circle cx="114.5" cy="108" r="1.3" fill="#fff" opacity=".8"/>
    <path d="M71 96 Q82 87 93 95" fill="none" stroke="#2d1410" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M107 95 Q118 87 129 96" fill="none" stroke="#2d1410" stroke-width="2.4" stroke-linecap="round"/>
    <!-- cheeks -->
    <ellipse cx="70" cy="122" rx="9" ry="6" fill="#e07b55" opacity=".45"/>
    <ellipse cx="130" cy="122" rx="9" ry="6" fill="#e07b55" opacity=".45"/>
    <!-- nose -->
    <path d="M98 112 Q101 117 104 114" fill="none" stroke="#d98a6c" stroke-width="2.2" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M84 126 Q100 146 116 126 Q100 131 84 126 Z" fill="#b83a58"/>
    <path d="M87 127 Q100 131 113 127 L112 130 Q100 133 88 130 Z" fill="#fff"/>
    <path d="M93 137 Q100 141 107 137 Q100 134 93 137 Z" fill="#ff8aa6"/>
    <!-- soft face shading -->
    <ellipse cx="100" cy="146" rx="40" ry="10" fill="url(#av-shade)"/>
  </g>
</svg>
