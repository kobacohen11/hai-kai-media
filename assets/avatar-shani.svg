<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="איור דמות מחייכת">
  <defs>
    <radialGradient id="sh-bg" cx="35%" cy="25%" r="85%"><stop offset="0" stop-color="#ffd1ea"/><stop offset=".5" stop-color="#ff7cc4"/><stop offset="1" stop-color="#8b5cf6"/></radialGradient>
    <radialGradient id="sh-skin" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#ffe6d6"/><stop offset=".6" stop-color="#ffcdb2"/><stop offset="1" stop-color="#e9a283"/></radialGradient>
    <linearGradient id="sh-hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9bf6e"/><stop offset="1" stop-color="#a8702c"/></linearGradient>
    <linearGradient id="sh-hair-hi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2c4" stop-opacity=".9"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/></linearGradient>
    <radialGradient id="sh-iris" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#6fb7ff"/><stop offset="1" stop-color="#1f4f9a"/></radialGradient>
    <linearGradient id="sh-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ee2ff"/><stop offset="1" stop-color="#2b7bd6"/></linearGradient>
    <radialGradient id="sh-shade" cx="50%" cy="100%" r="60%"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <clipPath id="sh-clip"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#sh-clip)">
    <circle cx="100" cy="100" r="100" fill="url(#sh-bg)"/>
    <circle cx="60" cy="40" r="40" fill="#fff" opacity=".12"/>
    <circle cx="100" cy="30" r="20" fill="url(#sh-hair)"/><path d="M86 26 Q100 14 114 26" fill="none" stroke="#fff2c4" stroke-width="3" opacity=".6"/><rect x="88" y="44" width="24" height="6" rx="3" fill="#ff5fb4"/>
    <!-- hair back -->
    <path d="M48 96 Q40 40 100 34 Q162 40 152 100 Q160 150 146 176 L54 176 Q38 150 48 96 Z" fill="url(#sh-hair)"/>
    <!-- body -->
    <path d="M36 210 Q40 166 100 160 Q160 166 164 210 Z" fill="url(#sh-top)"/>
    <path d="M70 168 Q100 186 130 168" fill="none" stroke="#e6fbff" stroke-width="3" opacity=".7"/>
    <!-- neck -->
    <path d="M86 138 L86 164 Q100 172 114 164 L114 138 Z" fill="#eaa98b"/>
    <!-- ears -->
    <ellipse cx="55" cy="106" rx="8" ry="11" fill="#f2b496"/>
    <ellipse cx="145" cy="106" rx="8" ry="11" fill="#f2b496"/>
    <circle cx="54" cy="120" r="4" fill="#ff5fb4" stroke="#fff" stroke-width="1.5"/>
    <circle cx="146" cy="120" r="4" fill="#ff5fb4" stroke="#fff" stroke-width="1.5"/>
    <!-- head -->
    <ellipse cx="100" cy="100" rx="46" ry="50" fill="url(#sh-skin)"/>
    <!-- bangs -->
    <path d="M53 100 Q48 46 104 42 Q154 48 147 100 Q146 80 136 70 Q110 84 76 70 Q60 80 53 100 Z" fill="url(#sh-hair)"/><path d="M70 66 Q100 60 132 76 Q108 64 84 70 Z" fill="#c58a3e" opacity=".6"/>
    <path d="M70 56 Q92 44 122 52 Q100 52 82 62 Z" fill="url(#sh-hair-hi)"/>
    <!-- brows -->
    <path d="M73 86 Q82 80 91 85" fill="none" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round"/>
    <path d="M109 85 Q118 80 127 86" fill="none" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="82" cy="102" rx="10" ry="12" fill="#fff"/>
    <ellipse cx="118" cy="102" rx="10" ry="12" fill="#fff"/>
    <circle cx="83" cy="104" r="8" fill="url(#sh-iris)"/>
    <circle cx="117" cy="104" r="8" fill="url(#sh-iris)"/>
    <circle cx="83" cy="105" r="3.6" fill="#1a0c07"/>
    <circle cx="117" cy="105" r="3.6" fill="#1a0c07"/>
    <circle cx="86" cy="100" r="2.8" fill="#fff"/>
    <circle cx="120" cy="100" r="2.8" fill="#fff"/>
    <circle cx="80.5" cy="108" r="1.3" fill="#fff" opacity=".8"/>
    <circle cx="114.5" cy="108" r="1.3" fill="#fff" opacity=".8"/>
    <path d="M71 96 Q82 87 93 95" fill="none" stroke="#2d1410" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M107 95 Q118 87 129 96" fill="none" stroke="#2d1410" stroke-width="2.4" stroke-linecap="round"/>
    <!-- cheeks -->
    <ellipse cx="70" cy="122" rx="9" ry="6" fill="#ff7c9c" opacity=".45"/>
    <ellipse cx="130" cy="122" rx="9" ry="6" fill="#ff7c9c" opacity=".45"/>
    <!-- nose -->
    <path d="M98 112 Q101 117 104 114" fill="none" stroke="#d98a6c" stroke-width="2.2" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M84 126 Q100 146 116 126 Q100 131 84 126 Z" fill="#b83a58"/>
    <path d="M87 127 Q100 131 113 127 L112 130 Q100 133 88 130 Z" fill="#fff"/>
    <path d="M93 137 Q100 141 107 137 Q100 134 93 137 Z" fill="#ff8aa6"/>
    <!-- soft face shading -->
    <ellipse cx="100" cy="146" rx="40" ry="10" fill="url(#sh-shade)"/>
  </g>
</svg>
